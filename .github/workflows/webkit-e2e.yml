name: webkit-e2e

# Runs the existing smoke test (tests/smoke.mjs) against Playwright's WebKit
# engine on every PR. WebKit is the same engine family as Safari/iOS, so it
# catches a real class of bug Chromium alone misses — e.g. the profile
# hero's backdrop-filter-under-overflow:hidden clipping bug, which only
# reproduces on a WebKit-family renderer. See CLAUDE.md's "Run / verify"
# section and tests/smoke.mjs's own header for the same caveat repeated
# there: this is Playwright's own Linux-built WebKit, not Apple's actual
# Safari — a good CI proxy for CSS/rendering bugs, not a substitute for a
# real-device check on anything iOS-specific.
#
# Deliberately a separate workflow file from export-workflow.yml (unrelated
# concern, its own path filters) rather than a job bolted onto it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webkit-smoke:
    name: smoke test — WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      # --with-deps pulls in the OS-level libraries (WebKitGTK, etc.) the
      # ubuntu-latest runner doesn't ship by default — without it the
      # browser downloads fine but fails to launch.
      - name: install WebKit for Playwright
        run: npx playwright install --with-deps webkit

      - name: start the dev server
        run: npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &

      - name: wait for the dev server to respond
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ | grep -q 200; then
              echo "dev server is up"
              exit 0
            fi
            sleep 1
          done
          echo "dev server never became ready — vite log follows:" >&2
          cat /tmp/vite.log >&2
          exit 1

      - name: run the smoke test against WebKit
        run: BASE_URL=http://localhost:5173/ npm run test:e2e:webkit

      # Screenshots are the standard debugging aid for this test (see
      # tests/smoke.mjs) — surfaced as an artifact so a CI-only failure can
      # be diagnosed without needing to reproduce it locally.
      - name: upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-smoke-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
